# The Master (build.sh, BHW=0): the Model B's bank images (modelb.cfg, region for
# region: the level files are shared) on the Master's hardware.  Main RAM below $0300
# is zero page, the stack and the low RAM (low.s), as the Model B's; then the level's
# tile table LV_PAGE0 at $0400, the Master's interrupt handler, chain, keys and sound
# at $0600 (MRAM) and their state at $0C00 (MRAMB), the level's objects at $1C00, the
# bar at $2B00 and the 32-row ring at $3000-$7FFF in main and shadow RAM (engine.s).
# While a level loads the ring is the loader's staging area (ldprog.s).
#
# Every level's data is loaded into the banks by the game's own loader, so only the
# code and the static tables are linked here, each fixed region to its own file;
# build.sh gathers them into BANKS with a piece table for the boot loader.  Code sits
# at the BOTTOM of banks 4, 5 and 6 (each entered at $8000) and the level's data runs
# from the Model B's code ends (tools/assets.py B4_CODE_END, B5_CODE_END), which the
# Master's code may fall short of but not pass (engine.s asserts it).  TILEMIRROR=1
# widens B6X and B5X and moves B6M up a page (build.sh edits the copy it links with).
MEMORY {
    ZP:      start = $0000, size = $00A3, type = rw, define = yes;   # below the fixed zero page (defs.inc, logic.s)
    MOSZP0:  start = $00F0, size = $0004, type = rw, define = yes;   # the MOS's zero page the game may use: not $F4
    MOSZP5:  start = $00F5, size = $0007, type = rw, define = yes;   #   (ROMSEL's copy) or $FC (the interrupt entry's A)
    MOSZPD:  start = $00FD, size = $0003, type = rw, define = yes;
    LOWBS:   start = $0140, size = $00C4, type = rw, define = yes;   # $0140-$0203
    LOWRAM:  start = $0206, size = $00FA, type = rw, define = yes;   # $0206-$02FF, clear of IRQ1V
    B4X:     start = $8000, size = $0400, type = ro, file = "build/b4x.bin", fill = no;   # the row loop, entered at $8000 (BANKENTRY)
    B4T:     start = $BB00, size = $0500, type = ro, file = "build/b4t.bin", fill = yes;  # SWAPTAB, MASKTAB0-3: to the end of the bank
    B6X:     start = $8000, size = $0700, type = rw, file = "build/b6x.bin", fill = no;   # bank6_entry + drawrect_clip at $8000 (BANKENTRY), the tile blitter, its variables
    B6M:     start = $8700, size = $3900, type = rw, file = "build/MENU",    fill = no;   # the menu overlay, over the tiles
    B5X:     start = $8000, size = $0300, type = rw, file = "build/b5x.bin", fill = no;   # the row loop, entered at $8000 (BANKENTRY); gather5, fetch8
    B5T:     start = $BC00, size = $0400, type = ro, file = "build/b5t.bin", fill = yes;  # MASKTAB0-3: to the end of the bank
    BOOTRAM: start = $7000, size = $0800, type = rw, file = "build/boot.bin", fill = no;  # start-up and the low-RAM image: main RAM (init.s), overwritten by play
    B7D:     start = $8000, size = $0220, type = rw, file = "",              fill = no;   # the level's tables (loaded): the start of bank 7
    B7:      start = $8220, size = $3DE0, type = rw, file = "build/b7.bin",  fill = no;
    NMI:     start = $0D00, size = $0100, type = rw, file = "",              fill = no;   # the NMI stubs run here (disc.s)
    MRAM:    start = $0600, size = $0600, type = rw, file = "build/mcode.bin", fill = no; # the Master's handler, chain, keys, sound
    MRAMB:   start = $0C00, size = $0100, type = rw, file = "",              fill = no;   # and their state (init.s zeroes it)
    BFX:     start = $0000, size = $0400, type = ro, file = "build/bankfix.bin", fill = no; # the bank-number patch list (cpu.inc BANKREF): appended to BANKS
    WFX:     start = $0000, size = $0400, type = ro, file = "build/wrfix.bin",   fill = no; # the write-bank store list (cpu.inc wrsel): appended after it
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    ZPHW:     load = ZP,     type = zp,    optional = yes;   # one machine's own, last: the shared lie alike
    ZPF0:     load = MOSZP0,  type = zp,    define = yes;
    ZPF5:     load = MOSZP5,  type = zp,    define = yes;
    ZPFD:     load = MOSZPD,  type = zp,    define = yes;
    LOWBSS:   load = LOWBS,  type = bss,   define = yes;
    LOWHW:    load = LOWBS,  type = bss,   optional = yes;   # one machine's own, last
    SPR4SWAP: load = B4T,    type = ro;
    SPR4MASK: load = B4T,    type = ro;
    SPR4CODE: load = B4X,    type = ro,    define = yes;
    TIL6ENT:  load = B6X,    type = ro;                               # bank6_entry + drawrect_clip
    TILCODE:  load = B6X,    type = ro,    define = yes;
    TILBSS:   load = B6X,    type = bss,   define = yes;
    MNUCODE:  load = B6M,    type = ro,    define = yes;
    MNUDATA:  load = B6M,    type = ro,    define = yes;
    MNUBSS:   load = B6M,    type = bss,   define = yes;
    BOOTHDR:  load = BOOTRAM, type = rw;                              # the loader's header and the entry (init.s): $7000, $7007
    BOOT:     load = BOOTRAM, type = rw,  define = yes;             # start-up (init.s): run where loaded
    LOWCODE:  load = BOOTRAM, run = LOWRAM, type = rw, define = yes;  # copied down by boot
    LOWBSS2:  load = LOWRAM, type = bss,   define = yes;              # GATHERL, above the low code
    SPR5MASK: load = B5T,    type = ro;
    SPR5CODE: load = B5X,    type = ro,    define = yes;
    MAP5CODE: load = B5X,    type = ro,    define = yes;              # the gather (gather5) and fetch8
    MAP5BSS:  load = B5X,    type = bss,   define = yes;              # its shape (the loader's)
    LGCLVL:   load = B7D,    type = bss,   define = yes, align = $100;  # attr, altcls, hdr
    LGCDATA:  load = B7,     type = ro,    define = yes;
    LGCCODE:  load = B7,     type = ro,    define = yes;
    NMISTUB:  load = B7,     run = NMI,   type = ro,  define = yes;   # copied to NMIPAGE for a load
    LGCBSS:   load = B7,     type = bss,   define = yes, align = $100;   # page aligned: its tables' page crossings do not move with the code
    LGCHW:    load = B7,     type = bss,   optional = yes, align = $100;   # one machine's own, last; page aligned: the Model B's SECTAB (the chain step's table) in one page
    CODE:     load = MRAM,   type = ro,    define = yes;              # the Master's own, by hardware (engine.s)
    TABLES:   load = MRAMB,  type = bss,   define = yes;
    BANKFIX:  load = BFX,    type = ro;
    WRFIX:    load = WFX,    type = ro,    optional = yes;   # (no board on the Master: empty)
}
