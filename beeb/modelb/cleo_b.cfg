# One assembly, five outputs: the four bank images and nothing else.  The main-RAM
# code is assembled for $0140 but stored in bank 7 (LOWCODE's load/run split) and
# copied down by the game's init, so the disc carries four files and no fifth.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    LOWBS:  start = $0140, size = $00C0, type = rw, define = yes;   # $0140-$01FF: the section table and the thunk table
    LOWRAM: start = $0206, size = $00FA, type = rw, define = yes;   # $0206-$02FF: the ISR and the thunks, clear of IRQ1V at $0204
    B4:     start = $8000, size = $4000, type = rw, file = "build/BANK4", fill = no, define = yes;
    B5:     start = $8000, size = $4000, type = rw, file = "build/BANK5", fill = no, define = yes;
    B6:     start = $8000, size = $4000, type = rw, file = "build/BANK6", fill = no, define = yes;
    B7:     start = $8000, size = $4000, type = rw, file = "build/BANK7", fill = no, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LGCCODE:  load = B7,     type = rw,    define = yes;   # first in bank 7: $8000 is the entry
    LOWCODE:  load = B7,     run = LOWRAM, type = rw, define = yes;
    LOWBSS:   load = LOWBS,  type = bss,   define = yes;
    SPRCODE:  load = B4,     type = rw,    define = yes;
    SPRDATA:  load = B4,     type = rw,    define = yes;
    SPRBSS:   load = B4,     type = bss,   define = yes;
    TILCODE:  load = B5,     type = rw,    define = yes;
    TILDATA:  load = B5,     type = rw,    define = yes;
    TILBSS:   load = B5,     type = bss,   define = yes;
    MAPCODE:  load = B6,     type = rw,    define = yes;
    MAPDATA:  load = B6,     type = rw,    define = yes;
    MAPBSS:   load = B6,     type = bss,   define = yes;
    LGCDATA:  load = B7,     type = rw,    define = yes;
    LGCBSS:   load = B7,     type = bss,   define = yes;
}
