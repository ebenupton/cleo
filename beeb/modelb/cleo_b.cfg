# One assembly, the fixed pieces of four bank images.  Main RAM below $0300 is zero
# page, the stack and the low RAM (low.s); $0300-$7FFF is the display (engine.s, screen
# shape) and, while a level loads, the loader's staging area (ldprog.s).
#
# Every level's data is loaded into the banks by the game's own loader, so only the
# code and the static tables are linked here, each fixed region to its own file;
# build.sh gathers them into BANKS with a piece table for the boot loader.  Code sits
# at the TOP of banks 4 and 6 so the sprite data below it can be any size (the
# bounds are tools/assets.py's B4_DATA / B6_TOP); bank 5's code and BSS sit below
# MENU_BASE, where the level's tiles or the menu overlay go.
MEMORY {
    ZP:      start = $0000, size = $00F0, type = rw, define = yes;
    LOWBS:   start = $0140, size = $00C4, type = rw, define = yes;   # $0140-$0203
    LOWRAM:  start = $0206, size = $00FA, type = rw, define = yes;   # $0206-$02FF, clear of IRQ1V
    B4C:     start = $8000, size = $0040, type = ro, file = "build/b4c.bin", fill = yes;
    B4T:     start = $8300, size = $0500, type = ro, file = "build/b4t.bin", fill = yes;
    B4X:     start = $BBE0, size = $0420, type = ro, file = "build/b4x.bin", fill = no;
    B5C:     start = $8000, size = $0190, type = ro, file = "build/b5c.bin", fill = yes;
    B5:      start = $8190, size = $1370, type = rw, file = "build/b5.bin",  fill = no;   # to MENU_BASE
    B5M:     start = $9500, size = $2B00, type = rw, file = "build/MENU",    fill = no;   # the menu overlay
    B6C:     start = $8000, size = $0040, type = ro, file = "build/b6c.bin", fill = yes;
    B6L:     start = $8040, size = $0140, type = rw, file = "build/b6l.bin", fill = yes;  # start-up + the low-RAM image
    B6T:     start = $8400, size = $0400, type = ro, file = "build/b6t.bin", fill = yes;
    B6X:     start = $BD60, size = $02A0, type = ro, file = "build/b6x.bin", fill = no;
    B7A:     start = $8000, size = $0300, type = ro, file = "build/b7a.bin", fill = yes;
    B7D:     start = $8300, size = $0700, type = rw, file = "",              fill = no;   # the level's tables (loaded)
    B7:      start = $8A00, size = $3600, type = rw, file = "build/b7.bin",  fill = no;
    NMI:     start = $0D00, size = $0100, type = rw, file = "",              fill = no;   # the NMI stubs run here (disc.s)
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWBS,  type = bss,   define = yes;
    COMMON4:  load = B4C,    type = ro;
    COMMON5:  load = B5C,    type = ro;
    COMMON6:  load = B6C,    type = ro;
    COMMON7:  load = B7A,    type = ro;
    SPR4SWAP: load = B4T,    type = ro;
    SPR4MASK: load = B4T,    type = ro;
    SPR4CODE: load = B4X,    type = ro,    define = yes;
    TILCODE:  load = B5,     type = ro,    define = yes;
    TILBSS:   load = B5,     type = bss,   define = yes;
    MNUCODE:  load = B5M,    type = ro,    define = yes;
    MNUDATA:  load = B5M,    type = ro,    define = yes;
    MNUBSS:   load = B5M,    type = bss,   define = yes;
    MAPLO:    load = B6L,    type = ro;
    LOWCODE:  load = B6L,    run = LOWRAM, type = rw, define = yes;   # copied down by init.s
    SPR6MASK: load = B6T,    type = ro;
    SPR6CODE: load = B6X,    type = ro,    define = yes;
    LGCENT:   load = B7A,    type = ro;
    LGCLO:    load = B7A,    type = ro;
    LGCLVL:   load = B7D,    type = bss,   define = yes, align = $100;  # objects, attr, altcls, hdr
    LGCDATA:  load = B7,     type = ro,    define = yes;
    LGCCODE:  load = B7,     type = ro,    define = yes;
    NMISTUB:  load = B7,     run = NMI,   type = ro,  define = yes;   # copied to NMIPAGE for a load
    LGCBSS:   load = B7,     type = bss,   define = yes;
}
