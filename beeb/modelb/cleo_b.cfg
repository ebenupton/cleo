# One assembly, four bank images.  Main RAM below $0300 is zero page, the stack and
# the low RAM (low.s); $0300-$7FFF is the display (engine.s, screen shape).  Every bank
# starts with the same 256 bytes of tables (banks.s COMMON_TABLES); the sprite banks
# 4 and 6 then carry SWAPTAB and MASKTAB0..3 at $8300 (defs.inc) with their sprite
# data from $8800, so the packer knows its addresses; bank 6's corner below the tables
# holds the start-up and the low-RAM image.
MEMORY {
    ZP:      start = $0000, size = $00F0, type = rw, define = yes;
    LOWBS:   start = $0140, size = $00C4, type = rw, define = yes;   # $0140-$0203
    LOWRAM:  start = $0206, size = $00FA, type = rw, define = yes;   # $0206-$02FF, clear of IRQ1V
    B4C:     start = $8000, size = $0020, type = ro, file = "build/BANK4", fill = yes;
    B4H:     start = $8020, size = $02E0, type = ro, file = "build/BANK4", fill = yes;
    B4S:     start = $8300, size = $0100, type = ro, file = "build/BANK4", fill = yes;
    B4M:     start = $8400, size = $0400, type = ro, file = "build/BANK4", fill = yes;
    B4:      start = $8800, size = $3800, type = rw, file = "build/BANK4", fill = no;
    B5C:     start = $8000, size = $0100, type = ro, file = "build/BANK5", fill = yes;
    B5:      start = $8100, size = $3F00, type = rw, file = "build/BANK5", fill = no;
    B6C:     start = $8000, size = $0020, type = ro, file = "build/BANK6", fill = yes;
    B6L:     start = $8020, size = $0130, type = rw, file = "build/BANK6", fill = yes;
    B6H:     start = $8150, size = $01B0, type = ro, file = "build/BANK6", fill = yes;
    B6S:     start = $8300, size = $0100, type = ro, file = "build/BANK6", fill = yes;
    B6M:     start = $8400, size = $0400, type = ro, file = "build/BANK6", fill = yes;
    B6:      start = $8800, size = $3800, type = rw, file = "build/BANK6", fill = no;
    B7C:     start = $8000, size = $0100, type = ro, file = "build/BANK7", fill = yes;
    B7E:     start = $8100, size = $0020, type = ro, file = "build/BANK7", fill = yes;
    B7L:     start = $8120, size = $00E0, type = ro, file = "build/BANK7", fill = yes;
    B7:      start = $8200, size = $3E00, type = rw, file = "build/BANK7", fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWBS,  type = bss,   define = yes;
    COMMON4:  load = B4C,    type = ro;
    COMMON5:  load = B5C,    type = ro;
    COMMON6:  load = B6C,    type = ro;
    COMMON7:  load = B7C,    type = ro;
    SPR4HOLE: load = B4H,    type = ro;
    SPR4SWAP: load = B4S,    type = ro;
    SPR4MASK: load = B4M,    type = ro;
    SPR4DATA: load = B4,     type = ro;
    SPR4CODE: load = B4,     type = ro,    define = yes;
    TILCODE:  load = B5,     type = ro,    define = yes;
    TILDATA:  load = B5,     type = ro,    define = yes, align = $100;
    TILBSS:   load = B5,     type = bss,   define = yes, align = $100;
    MAPLO:    load = B6L,    type = ro;
    LOWCODE:  load = B6L,    run = LOWRAM, type = rw, define = yes;   # copied down by init.s
    SPR6HOLE: load = B6H,    type = ro;
    SPR6SWAP: load = B6S,    type = ro;
    SPR6MASK: load = B6M,    type = ro;
    MAPDATA:  load = B6,     type = ro,    define = yes;          # the map first: $8800 is a page
    SPR6DATA: load = B6,     type = ro;
    SPR6CODE: load = B6,     type = ro,    define = yes;
    LGCENT:   load = B7E,    type = ro;
    LGCLO:    load = B7L,    type = ro;
    LGCDATA:  load = B7,     type = ro,    define = yes, align = $100;   # first: $8200 is a page
    LGCCODE:  load = B7,     type = ro,    define = yes;
    LGCBSS:   load = B7,     type = bss,   define = yes;
}
