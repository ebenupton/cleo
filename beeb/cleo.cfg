MEMORY {
    ZP:    start = $0000, size = $00A8, type = rw;
    TAB:   start = $0400, size = $0900, type = rw;
    MAIN:  start = $0E00, size = $2200, type = rw, file = %O, fill = no, define = yes;
    LOGIC: start = $8900, size = $2700, type = rw, file = "build/LOGIC", fill = no, define = yes;   # bank 7, above the level's tables: a Model B has no HAZEL
    LOW:   start = $0D03, size = $00ED, type = rw, file = %O, fill = no, define = yes;   # NMI page after the JMP; $DF0.. left to the MOS
    LOW2:  start = $0206, size = $01FA, type = rw, file = %O, fill = no, define = yes;   # MOS vectors (bar IRQ1V) + VDU page: free once MODE 2 is set and the MOS is abandoned
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    TABLES:   load = TAB,   type = bss;
    CODE:     load = MAIN,  type = rw;
    LOGIC:    load = LOGIC, type = rw;
    LOW:      load = LOW,   type = rw;
    LOW2:     load = LOW2,  type = rw;
}
