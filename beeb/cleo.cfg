MEMORY {
    ZP:    start = $0000, size = $00A8, type = rw;
    TAB:   start = $0400, size = $0900, type = rw;
    MAIN:  start = $0E00, size = $2200, type = rw, file = %O, fill = no, define = yes;
    HAZEL: start = $C000, size = $2000, type = rw, file = %O, fill = no, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    TABLES:   load = TAB,   type = bss;
    CODE:     load = MAIN,  type = rw;
    HAZEL:    load = HAZEL, type = rw;
}
